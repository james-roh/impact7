<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { box-sizing: border-box; }
  .si-wrap { padding: 32px 36px; font-family: 'Malgun Gothic', sans-serif; color: #1B1B1B; }
  .si-title { font-size: 24px; font-weight: 800; margin: 0 0 6px; }
  .si-sub { font-size: 13px; color: #6b6b6b; margin: 0 0 24px; }
  .si-section { margin-bottom: 34px; }
  .si-section-head {
    background: #1B6B45; color: #fff; font-size: 16px; font-weight: 700;
    padding: 12px 18px; border-radius: 10px 10px 0 0;
    display: flex; align-items: center; gap: 8px;
  }
  .si-count { font-size: 12px; font-weight: 500; opacity: 0.85; margin-left: auto; }
  .si-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px; background: #fff; padding: 18px;
    border: 1px solid #e3e0d8; border-top: none; border-radius: 0 0 10px 10px;
  }
  .si-card {
    border: 1px solid #e7e4dc; border-radius: 10px; padding: 14px 16px;
    background: #fbfaf7; transition: box-shadow .15s;
  }
  .si-card:hover { box-shadow: 0 4px 14px rgba(0,0,0,0.08); }
  .si-card-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .si-name { font-size: 15px; font-weight: 700; }
  .si-tag { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 20px; color: #fff; }
  .tag-남 { background: #3B7BBF; }
  .tag-여 { background: #C2568C; }
  .tag-공학 { background: #6B9E5F; }
  .si-total { margin-left: auto; font-size: 13px; font-weight: 700; color: #1B6B45; }
  .si-grades { display: flex; gap: 6px; }
  .si-grade {
    flex: 1; text-align: center; background: #fff; border: 1px solid #ececec;
    border-radius: 8px; padding: 7px 4px;
  }
  .si-grade-label { font-size: 10px; color: #999; margin-bottom: 3px; }
  .si-grade-val { font-size: 13px; font-weight: 700; }
  .si-mf { font-size: 10px; color: #888; margin-top: 2px; }
</style>
</head>

function gradeCell(label, m, w, isCoed) {
  const val = isCoed ? (m + w) : (m || w);
  const mf = isCoed ? `<div class="si-mf">남${m}·여${w}</div>` : '';
  return `<div class="si-grade">
    <div class="si-grade-label">${label}</div>
    <div class="si-grade-val">${val}</div>${mf}
  </div>`;
}

function render() {
  const root = document.getElementById('si-root');
  let html = '';
  for (const [섹션, info] of Object.entries(DATA)) {
    html += `<div class="si-section">
      <div class="si-section-head">
        <i class="fas fa-school"></i> ${섹션}
        <span class="si-count">${info.schools.length}개교</span>
      </div>
      <div class="si-grid">`;
    info.schools.forEach(s => {
      const [name, gender, total, m1,w1,m2,w2,m3,w3] = s;
      const coed = gender === '공학';
      html += `<div class="si-card">
        <div class="si-card-head">
          <span class="si-name">${name}</span>
          <span class="si-tag tag-${gender}">${gender}</span>
          <span class="si-total">총 ${total}</span>
        </div>
        <div class="si-grades">
          ${gradeCell(info.grades[0], m1, w1, coed)}
          ${gradeCell(info.grades[1], m2, w2, coed)}
          ${gradeCell(info.grades[2], m3, w3, coed)}
        </div>
      </div>`;
    });
    html += `</div></div>`;
  }
  root.innerHTML = html;
}
