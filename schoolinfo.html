<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학교 인원 현황</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background-color: #f8f9fa; }
    h2 { color: #333; }
    table { width: 100%; max-width: 600px; border-collapse: collapse; background: #fff; margin-top: 15px; }
    th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
    th { background-color: #0d6efd; color: white; }
    #loading { font-weight: bold; color: #666; }
  </style>
</head>
<body>

  <h2>🏫 학교별 학생 수 현황</h2>
  <div id="loading">데이터를 불러오는 중입니다...</div>
  
  <table id="schoolTable" style="display: none;">
    <thead>
      <tr>
        <th>학교명</th>
        <th>총 학생 수</th>
        <th>기준년도</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <script>
    // 1. 배포한 웹 앱 URL 지정
    const API_URL = "YOUR_WEB_APP_URL";

    // 2. API 데이터 호출 함수
    async function fetchSchoolData() {
      try {
        const response = await fetch(API_URL);
        const data = await response.json();

        const tableBody = document.getElementById("tableBody");
        tableBody.innerHTML = "";

        // 3. 받아온 JSON 데이터를 표 행(row)으로 추가
        data.forEach(item => {
          const row = `
            <tr>
              <td>${item.schoolName}</td>
              <td>${item.totalStudents.toLocaleString()}명</td>
              <td>${item.year}년</td>
            </tr>
          `;
          tableBody.innerHTML += row;
        });

        // 로딩 문구 숨기고 표 표시
        document.getElementById("loading").style.display = "none";
        document.getElementById("schoolTable").style.display = "table";

      } catch (error) {
        document.getElementById("loading").innerText = "데이터를 불러오는 데 실패했습니다.";
        console.error("Error:", error);
      }
    }

    // 페이지 로드 시 실행
    fetchSchoolData();
  </script>

</body>
</html>
