<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학교별 학년별 학생수 조회</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: 'Malgun Gothic', sans-serif; max-width: 650px; margin: 40px auto; padding: 20px; line-height: 1.6; }
    h2 { color: #333; text-align: center; }
    .search-box { display: flex; gap: 10px; margin-bottom: 25px; }
    input { flex: 1; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
    button { padding: 12px 24px; font-size: 16px; background-color: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background-color: #0056b3; }
    .chart-box { margin-top: 30px; }
  </style>
</head>
<body>

  <h2>🏫 학교별 학년별 학생수 조회</h2>
  
  <div class="search-box">
    <input type="text" id="schoolName" placeholder="학교명을 입력하세요 (예: 강서고등학교 또는 강서고)">
    <button onclick="fetchStudentData()">조회</button>
  </div>

  <div class="chart-box">
    <canvas id="studentChart"></canvas>
  </div>

  <script>
    // 본인의 API 키를 입력하세요.
    const API_KEY = '여기에_발급받은_API키를_붙여넣으세요';
    let myChart = null;

    async function fetchStudentData() {
      const schoolName = document.getElementById('schoolName').value.trim();
      if (!schoolName) {
        alert('학교명을 입력해주세요.');
        return;
      }

      try {
        // 공시연도(pYear=2024) 파라미터 추가
        const targetUrl = `https://www.schoolinfo.go.kr/openApi.do?apiKey=${API_KEY}&apiType=37&pYear=2024&searchSchulNm=${encodeURIComponent(schoolName)}`;
        const response = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`);
        
        const data = await response.json();
        console.log('API 응답 데이터:', data); // F12 콘솔에서 실제 들어오는 데이터 확인용

        // API 응답 데이터 목록 확인
        const list = data.list || data.result || [];

        if (!list || list.length === 0) {
          alert('해당 학교의 데이터를 찾을 수 없습니다. 학교명을 다시 확인해주세요.');
          return;
        }

        const schoolInfo = list[0];

        // 필드명이 대/소문자 또는 변수명이 다를 수 있으므로 안전하게 처리
        const gradeData = {
          labels: ['1학년', '2학년', '3학년'],
          male: [
            parseInt(schoolInfo.COL_M1 || schoolInfo.col_m1 || 0), 
            parseInt(schoolInfo.COL_M2 || schoolInfo.col_m2 || 0), 
            parseInt(schoolInfo.COL_M3 || schoolInfo.col_m3 || 0)
          ],
          female: [
            parseInt(schoolInfo.COL_W1 || schoolInfo.col_w1 || 0), 
            parseInt(schoolInfo.COL_W2 || schoolInfo.col_w2 || 0), 
            parseInt(schoolInfo.COL_W3 || schoolInfo.col_w3 || 0)
          ]
        };

        drawChart(gradeData, schoolInfo.SCHUL_NM || schoolInfo.schulNm || schoolName);

      } catch (error) {
        console.error(error);
        alert('데이터 처리 중 오류가 발생했습니다. 브라우저 콘솔(F12)을 확인해 주세요.');
      }
    }

    function drawChart(data, schoolTitle) {
      const ctx = document.getElementById('studentChart').getContext('2d');
      
      if (myChart) myChart.destroy();

      myChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: data.labels,
          datasets: [
            { label: '남학생', data: data.male, backgroundColor: '#4bc0c0' },
            { label: '여학생', data: data.female, backgroundColor: '#ff6384' }
          ]
        },
        options: {
          responsive: true,
          plugins: {
            title: { display: true, text: `${schoolTitle} 학년별 학생수` }
          },
          scales: {
            x: { stacked: true },
            y: { stacked: true, beginAtZero: true }
          }
        }
      });
    }
  </script>
</body>
</html>
