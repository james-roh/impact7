<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학교별 학년별 학생수 조회</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: 'Malgun Gothic', sans-serif; max-width: 650px; margin: 40px auto; padding: 20px; line-height: 1.6; }
    h2 { color: #333; text-align: center; }
    .search-box { display: flex; gap: 10px; margin-bottom: 25px; }
    input { flex: 1; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
    button { padding: 12px 24px; font-size: 16px; background-color: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background-color: #0056b3; }
    .chart-box { margin-top: 30px; }
  </style>
</head>
<body>

  <h2>🏫 학교별 학년별 학생수 조회</h2>
  
  <div class="search-box">
    <input type="text" id="schoolName" placeholder="학교명을 입력하세요 (예: 강서고등학교)">
    <button onclick="fetchStudentData()">조회</button>
  </div>

  <div class="chart-box">
    <canvas id="studentChart"></canvas>
  </div>

  <script>
    // ★★★ 아래 작은따옴표 사이에 실제 API 키를 꼭 붙여넣으세요! ★★★
    const API_KEY = '337a6313ee714f67b6d7e33e086f6116';
    let myChart = null;

    async function fetchStudentData() {
      const schoolName = document.getElementById('schoolName').value.trim();
      if (!schoolName) {
        alert('학교명을 입력해주세요.');
        return;
      }

      if (API_KEY.includes('여기에_발급받은')) {
        alert('API 키가 입력되지 않았습니다. 코드 38번째 줄에 키를 넣어주세요.');
        return;
      }

try {
        // 공시연도 파라미터 제외하여 최신/기본 데이터 검색 유연화
        const targetUrl = `https://www.schoolinfo.go.kr/openApi.do?apiKey=${API_KEY}&apiType=37&searchSchulNm=${encodeURIComponent(schoolName)}`;
        const response = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`);
        
        const data = await response.json();
        console.log('API 응답 전체 데이터:', data);

        // 다양한 응답 형태(배열, list, result)를 유연하게 수집
        let list = [];
        if (Array.isArray(data)) list = data;
        else if (data.list) list = data.list;
        else if (data.result) list = data.result;

        if (!list || list.length === 0) {
          alert('해당 학교의 데이터를 찾을 수 없습니다. "강서고"처럼 이름을 줄여서 입력해 보세요.');
          return;
        }

        // 검색한 학교명과 가장 가까운 데이터 선택
        const schoolInfo = list.find(item => {
          const name = item.SCHUL_NM || item.schulNm || item.SCHUL_NM_KOR || '';
          return name.includes(schoolName) || schoolName.includes(name);
        }) || list[0];

        // 대소문자 속성명 자동 탐색 함수
        const getValue = (k1, k2) => {
          return parseInt(schoolInfo[k1] || schoolInfo[k2] || schoolInfo[k1.toLowerCase()] || schoolInfo[k2.toLowerCase()] || 0);
        };

        const gradeData = {
          labels: ['1학년', '2학년', '3학년'],
          male: [
            getValue('COL_M1', 'MALE_1'), 
            getValue('COL_M2', 'MALE_2'), 
            getValue('COL_M3', 'MALE_3')
          ],
          female: [
            getValue('COL_W1', 'FEMALE_1'), 
            getValue('COL_W2', 'FEMALE_2'), 
            getValue('COL_W3', 'FEMALE_3')
          ]
        };

        const schoolTitle = schoolInfo.SCHUL_NM || schoolInfo.schulNm || schoolName;
        drawChart(gradeData, schoolTitle);

      } catch (error) {
        console.error(error);
        alert('데이터를 불러오는 중 오류가 발생했습니다.');
      }
    }

    function drawChart(data, schoolTitle) {
      const ctx = document.getElementById('studentChart').getContext('2d');
      
      if (myChart) myChart.destroy();

      myChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: data.labels,
          datasets: [
            { label: '남학생', data: data.male, backgroundColor: '#4bc0c0' },
            { label: '여학생', data: data.female, backgroundColor: '#ff6384' }
          ]
        },
        options: {
          responsive: true,
          plugins: {
            title: { display: true, text: `${schoolTitle} 학년별 학생수` }
          },
          scales: {
            x: { stacked: true },
            y: { stacked: true, beginAtZero: true }
          }
        }
      });
    }
  </script>
</body>
</html>
