<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학교별 인원 현황</title>
  <style>
    body { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; padding: 25px; background-color: #f4f6f8; line-height: 1.6; }
    .container { max-width: 950px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); }
    h2 { border-bottom: 2px solid #2c3e50; padding-bottom: 12px; color: #2c3e50; font-size: 1.5rem; display: flex; align-items: center; justify-content: space-between; }
    
    .section-title { font-size: 1.25rem; font-weight: 700; margin-top: 35px; margin-bottom: 12px; color: #16a085; display: flex; align-items: center; }
    
    /* 도표(테이블) 스타일 */
    .school-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 0.95rem; }
    .school-table th, .school-table td { border: 1px solid #e2e8f0; padding: 10px 14px; text-align: center; }
    .school-table th { background-color: #f8fafc; color: #475569; font-weight: 600; }
    .school-table tr:nth-child(even) { background-color: #f8fafc; }
    .school-table tr:hover { background-color: #f1f5f9; }
    
    .school-name { font-weight: 700; color: #1e293b; text-align: left; padding-left: 16px; }
    .type-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; background-color: #e2e8f0; color: #475569; }
    .error-text { color: #ef4444; font-style: italic; font-size: 0.88rem; }
    
    .status-loading { color: #f59e0b; font-size: 1rem; font-weight: 600; }
    .status-complete { color: #10b981; font-size: 1rem; font-weight: 600; }
  </style>
</head>
<body>

  <div class="container">
    <h2>
      <span>🏫 학교별 인원 현황</span>
      <span id="status" class="status-loading">(데이터 조회 중...)</span>
    </h2>
    <div id="displayArea"></div>
  </div>

  <script>
    // Apps Script 웹 앱 URL 입력 (/exec 로 끝나는 주소)
    const PROXY_URL = "https://script.google.com/macros/s/AKfycbwmP1hhMxw1YWM7ShFLR0uhgf15ZyeXFwB64f4OBwqK9jyHdtkuH7cYxx44kcBjzIPw/exec"; 

    const schoolTargetList = [
      // 고등학교
      { name: "강서고등학교", displayName: "강서고", category: "고등학교", type: "단성" },
      { name: "신서고등학교", displayName: "신서고", category: "고등학교", type: "공학" },
      { name: "신도림고등학교", displayName: "신도림고", category: "고등학교", type: "공학" },
      { name: "세현고등학교", displayName: "세현고", category: "고등학교", type: "공학" },
      { name: "한가람고등학교", displayName: "한가람고", category: "고등학교", type: "공학" },
      { name: "목동고등학교", displayName: "목동고", category: "고등학교", type: "단성" },
      { name: "신목고등학교", displayName: "신목고", category: "고등학교", type: "단성" },
      
      // 중학교
      { name: "목일중학교", displayName: "목일중", category: "중학교", type: "공학" },
      { name: "신목중학교", displayName: "신목중", category: "중학교", type: "공학" },
      { name: "마포중학교", displayName: "마포중", category: "중학교", type: "남중" },
      { name: "봉영여자중학교", displayName: "봉영여중", category: "중학교", type: "여중" },
      
      // 초등학교
      { name: "서울갈산초등학교", displayName: "갈산초", category: "초등학교", type: "공학" },
      { name: "서울경인초등학교", displayName: "경인초", category: "초등학교", type: "공학" }
    ];

    async function fetchSchoolData(schoolObj) {
      try {
        const url = `${PROXY_URL}?schoolName=${encodeURIComponent(schoolObj.name)}&category=${encodeURIComponent(schoolObj.category)}`;
        const response = await fetch(url);
        
        if (!response.ok) {
          throw new Error("HTTP 오류");
        }
        
        const data = await response.json();
        if (data.error) {
          return { ...schoolObj, error: data.error };
        }
        return { ...schoolObj, ...data };
      } catch (err) {
        return { ...schoolObj, error: "통신 오류 (권한/URL 확인 필요)" };
      }
    }

    function buildTableHtml(categoryName, schoolList) {
      const isElem = categoryName === "초등학교";
      const g1Label = isElem ? "4학년" : "1학년";
      const g2Label = isElem ? "5학년" : "2학년";
      const g3Label = isElem ? "6학년" : "3학년";

      let tableHtml = `
        <div class="section-title">${categoryName} (${g1Label}, ${g2Label}, ${g3Label})</div>
        <table class="school-table">
          <thead>
            <tr>
              <th style="width: 20%;">학교명</th>
              <th style="width: 12%;">구분</th>
              <th style="width: 22%;">총 인원</th>
              <th style="width: 15%;">${g1Label}</th>
              <th style="width: 15%;">${g2Label}</th>
              <th style="width: 15%;">${g3Label}</th>
            </tr>
          </thead>
          <tbody>
      `;

      schoolList.forEach(item => {
        if (item.error) {
          tableHtml += `
            <tr>
              <td class="school-name">${item.displayName}</td>
              <td><span class="type-badge">${item.type || '-'}</span></td>
              <td colspan="4" class="error-text">${item.error}</td>
            </tr>
          `;
          return;
        }

        const isCoed = item.type === "공학" || isElem;

        if (isCoed) {
          const totalM = item.g1_m + item.g2_m + item.g3_m;
          const totalF = item.g1_f + item.g2_f + item.g3_f;
          tableHtml += `
            <tr>
              <td class="school-name">${item.displayName}</td>
              <td><span class="type-badge">${item.type || '공학'}</span></td>
              <td><strong>총 ${totalM}+${totalF}명</strong></td>
              <td>${item.g1_m}+${item.g1_f}</td>
              <td>${item.g2_m}+${item.g2_f}</td>
              <td>${item.g3_m}+${item.g3_f}</td>
            </tr>
          `;
        } else {
          const g1 = item.g1_m + item.g1_f;
          const g2 = item.g2_m + item.g2_f;
          const g3 = item.g3_m + item.g3_f;
          tableHtml += `
            <tr>
              <td class="school-name">${item.displayName}</td>
              <td><span class="type-badge">${item.type || '단성'}</span></td>
              <td><strong>총 ${g1 + g2 + g3}명</strong></td>
              <td>${g1}</td>
              <td>${g2}</td>
              <td>${g3}</td>
            </tr>
          `;
        }
      });

      tableHtml += `</tbody></table>`;
      return tableHtml;
    }

    async function init() {
      const results = await Promise.all(schoolTargetList.map(s => fetchSchoolData(s)));

      const categorized = { "고등학교": [], "중학교": [], "초등학교": [] };
      results.forEach(r => categorized[r.category]?.push(r));

      let fullHtml = "";

      ["고등학교", "중학교", "초등학교"].forEach(cat => {
        if (categorized[cat] && categorized[cat].length > 0) {
          fullHtml += buildTableHtml(cat, categorized[cat]);
        }
      });

      document.getElementById("displayArea").innerHTML = fullHtml;
      document.getElementById("status").className = "status-complete";
      document.getElementById("status").innerText = "(조회 완료)";
    }

    init();
  </script>

</body>
</html>
